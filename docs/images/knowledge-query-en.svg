<svg width="900" height="650"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lookupCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2647;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow6">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#bg6)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#4ecca3" font-size="20" font-weight="bold">Knowledge Lookup Flow - Module 1</text>
  <text x="450" y="58" text-anchor="middle" fill="#8d99ae" font-size="12">Quick retrieval of exam-relevant knowledge | Every point cites authoritative source</text>

  <!-- Input box -->
  <rect x="300" y="80" width="300" height="45" rx="22" fill="#0f3460" stroke="#4ecca3" stroke-width="2" filter="url(#shadow6)"/>
  <text x="450" y="108" text-anchor="middle" fill="#4ecca3" font-size="14" font-weight="bold">User Query Input</text>

  <!-- Arrow down -->
  <line x1="450" y1="125" x2="450" y2="150" stroke="#4ecca3" stroke-width="2"/>
  <polygon points="445,148 455,148 450,158" fill="#4ecca3"/>

  <!-- 3 Search Paths -->
  <text x="450" y="175" text-anchor="middle" fill="#8d99ae" font-size="12">Select Search Path</text>

  <!-- Path 1: By Subject -->
  <rect x="40" y="190" width="260" height="110" rx="10" fill="url(#lookupCard)" stroke="#4ecca3" stroke-width="1" filter="url(#shadow6)"/>
  <text x="170" y="215" text-anchor="middle" fill="#4ecca3" font-size="13" font-weight="bold">Path A: By Subject</text>
  <text x="55" y="238" fill="#c0c0d0" font-size="11">- Basic Medical Sciences</text>
  <text x="55" y="256" fill="#c0c0d0" font-size="11">- Clinical Medicine</text>
  <text x="55" y="274" fill="#c0c0d0" font-size="11">- Medical Humanities</text>
  <text x="55" y="292" fill="#c0c0d0" font-size="11">- Preventive Medicine + TCM</text>

  <!-- Path 2: By System -->
  <rect x="320" y="190" width="260" height="110" rx="10" fill="url(#lookupCard)" stroke="#e94560" stroke-width="1" filter="url(#shadow6)"/>
  <text x="450" y="215" text-anchor="middle" fill="#e94560" font-size="13" font-weight="bold">Path B: By Organ System</text>
  <text x="335" y="238" fill="#c0c0d0" font-size="11">- Cardiovascular / Respiratory</text>
  <text x="335" y="256" fill="#c0c0d0" font-size="11">- Digestive / Urinary / Endocrine</text>
  <text x="335" y="274" fill="#c0c0d0" font-size="11">- Neuro / Heme / Rheumatology</text>
  <text x="335" y="292" fill="#c0c0d0" font-size="11">- OBGYN / Pediatric / Infectious</text>

  <!-- Path 3: By Disease -->
  <rect x="600" y="190" width="260" height="110" rx="10" fill="url(#lookupCard)" stroke="#f5a623" stroke-width="1" filter="url(#shadow6)"/>
  <text x="730" y="215" text-anchor="middle" fill="#f5a623" font-size="13" font-weight="bold">Path C: By Disease</text>
  <text x="615" y="238" fill="#c0c0d0" font-size="11">- Search any disease name</text>
  <text x="615" y="256" fill="#c0c0d0" font-size="11">- Returns: Dx + DDx + Tx</text>
  <text x="615" y="274" fill="#c0c0d0" font-size="11">- Exam-relevant annotations</text>
  <text x="615" y="292" fill="#c0c0d0" font-size="11">- High-frequency exam tags</text>

  <!-- Arrows down -->
  <line x1="170" y1="300" x2="170" y2="325" stroke="#4ecca3" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="300" x2="450" y2="325" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="730" y1="300" x2="730" y2="325" stroke="#f5a623" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Knowledge Retrieval -->
  <rect x="100" y="330" width="700" height="60" rx="10" fill="#0f3460" stroke="#8d99ae" stroke-width="2" filter="url(#shadow6)"/>
  <text x="450" y="365" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Knowledge Retrieval Engine</text>

  <!-- Arrow down -->
  <line x1="450" y1="390" x2="450" y2="415" stroke="#8d99ae" stroke-width="2"/>
  <polygon points="445,413 455,413 450,423" fill="#8d99ae"/>

  <!-- Output: Knowledge Card -->
  <rect x="50" y="430" width="800" height="190" rx="10" fill="url(#lookupCard)" stroke="#7b68ee" stroke-width="2" filter="url(#shadow6)"/>
  <text x="450" y="455" text-anchor="middle" fill="#7b68ee" font-size="15" font-weight="bold">Structured Knowledge Output</text>

  <!-- Output items -->
  <rect x="70" y="470" width="230" height="60" rx="6" fill="#0a2647" opacity="0.6"/>
  <text x="185" y="490" text-anchor="middle" fill="#4ecca3" font-size="12" font-weight="bold">Core Knowledge</text>
  <text x="185" y="508" text-anchor="middle" fill="#c0c0d0" font-size="11">Definition + Mechanism</text>
  <text x="185" y="523" text-anchor="middle" fill="#c0c0d0" font-size="11">Key features + Classification</text>

  <rect x="335" y="470" width="230" height="60" rx="6" fill="#0a2647" opacity="0.6"/>
  <text x="450" y="490" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Exam Relevance</text>
  <text x="450" y="508" text-anchor="middle" fill="#c0c0d0" font-size="11">Frequency tag (High/Med/Low)</text>
  <text x="450" y="523" text-anchor="middle" fill="#c0c0d0" font-size="11">Question type mapping</text>

  <rect x="600" y="470" width="230" height="60" rx="6" fill="#0a2647" opacity="0.6"/>
  <text x="715" y="490" text-anchor="middle" fill="#f5a623" font-size="12" font-weight="bold">Authoritative Source</text>
  <text x="715" y="508" text-anchor="middle" fill="#c0c0d0" font-size="11">NHC Syllabus citation</text>
  <text x="715" y="523" text-anchor="middle" fill="#c0c0d0" font-size="11">PMPH textbook reference</text>

  <!-- Source badges -->
  <text x="70" y="560" fill="#8d99ae" font-size="11">Sources:</text>
  <rect x="130" y="548" width="110" height="20" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="1"/>
  <text x="185" y="562" text-anchor="middle" fill="#4ecca3" font-size="10">NHC Syllabus 2024</text>

  <rect x="250" y="548" width="130" height="20" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="315" y="562" text-anchor="middle" fill="#e94560" font-size="10">PMPH Guide Series</text>

  <rect x="390" y="548" width="120" height="20" rx="10" fill="#0f3460" stroke="#f5a623" stroke-width="1"/>
  <text x="450" y="562" text-anchor="middle" fill="#f5a623" font-size="10">CMA Guidelines</text>

  <rect x="520" y="548" width="140" height="20" rx="10" fill="#0f3460" stroke="#7b68ee" stroke-width="1"/>
  <text x="590" y="562" text-anchor="middle" fill="#7b68ee" font-size="10">10th Ed. Textbooks</text>

  <text x="70" y="600" fill="#8d99ae" font-size="11">Every knowledge point is traceable to an official source - no misinformation, no outdated content.</text>
  <text x="70" y="615" fill="#8d99ae" font-size="11">2026 updates included: Medical Humanities revision + 10th edition textbook changes.</text>
</svg>
