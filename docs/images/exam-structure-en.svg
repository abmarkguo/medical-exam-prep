<svg width="900" height="700"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stageCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2647;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e94560" font-size="20" font-weight="bold">Exam Structure - Clinical Medical Licensing Examination</text>
  <text x="450" y="58" text-anchor="middle" fill="#8d99ae" font-size="12">Two-stage examination system | Skills Exam + Comprehensive Written Exam</text>

  <!-- Stage 1: Practical Skills Exam -->
  <rect x="50" y="85" width="360" height="280" rx="10" fill="url(#stageCard)" stroke="#4ecca3" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="50" y="85" width="360" height="36" rx="10" fill="#4ecca3" opacity="0.2"/>
  <text x="230" y="108" text-anchor="middle" fill="#4ecca3" font-size="16" font-weight="bold">Stage 1: Practical Skills Exam</text>

  <text x="230" y="138" text-anchor="middle" fill="#ffffff" font-size="12">Total: 100 points | Pass: 60 | Validity: 2 years</text>

  <!-- Station 1 -->
  <rect x="70" y="155" width="320" height="60" rx="6" fill="#0a2647" stroke="#4ecca3" stroke-width="1" opacity="0.8"/>
  <text x="230" y="175" text-anchor="middle" fill="#4ecca3" font-size="13" font-weight="bold">Station 1: Clinical Thinking (40 pts)</text>
  <text x="230" y="192" text-anchor="middle" fill="#c0c0d0" font-size="11">History Taking (15 pts) + Case Analysis (25 pts)</text>
  <text x="230" y="207" text-anchor="middle" fill="#8d99ae" font-size="10">Duration: ~26 min | Computer + Written</text>

  <!-- Station 2 -->
  <rect x="70" y="225" width="320" height="60" rx="6" fill="#0a2647" stroke="#f5a623" stroke-width="1" opacity="0.8"/>
  <text x="230" y="245" text-anchor="middle" fill="#f5a623" font-size="13" font-weight="bold">Station 2: Physical Exam + Operations (30 pts)</text>
  <text x="230" y="262" text-anchor="middle" fill="#c0c0d0" font-size="11">Physical Exam (15 pts) + Basic Operations (15 pts)</text>
  <text x="230" y="277" text-anchor="middle" fill="#8d99ae" font-size="10">Duration: ~24 min | Hands-on + Oral</text>

  <!-- Station 3 -->
  <rect x="70" y="295" width="320" height="60" rx="6" fill="#0a2647" stroke="#7b68ee" stroke-width="1" opacity="0.8"/>
  <text x="230" y="315" text-anchor="middle" fill="#7b68ee" font-size="13" font-weight="bold">Station 3: Multimedia (30 pts)</text>
  <text x="230" y="332" text-anchor="middle" fill="#c0c0d0" font-size="11">Auscultation(8) + Imaging(6) + ECG(7) + Ethics(9)</text>
  <text x="230" y="347" text-anchor="middle" fill="#8d99ae" font-size="10">Duration: ~15 min | Computer-based</text>

  <!-- Arrow -->
  <polygon points="425,225 440,215 440,235" fill="#e94560"/>
  <text x="430" y="200" text-anchor="middle" fill="#e94560" font-size="11" font-weight="bold">Pass</text>
  <text x="430" y="255" text-anchor="middle" fill="#e94560" font-size="20" font-weight="bold">-&gt;</text>

  <!-- Stage 2: Written Exam -->
  <rect x="490" y="85" width="360" height="280" rx="10" fill="url(#stageCard)" stroke="#e94560" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="490" y="85" width="360" height="36" rx="10" fill="#e94560" opacity="0.2"/>
  <text x="670" y="108" text-anchor="middle" fill="#e94560" font-size="16" font-weight="bold">Stage 2: Medical Comprehensive Exam</text>

  <text x="670" y="138" text-anchor="middle" fill="#ffffff" font-size="12">Practitioner: 600 Q | 360 to pass | Assistant: 300 Q | 180 to pass</text>

  <!-- Unit 1 -->
  <rect x="510" y="155" width="160" height="60" rx="6" fill="#0a2647" stroke="#e94560" stroke-width="1" opacity="0.8"/>
  <text x="590" y="173" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Unit 1</text>
  <text x="590" y="190" text-anchor="middle" fill="#c0c0d0" font-size="10">Basic Sciences</text>
  <text x="590" y="205" text-anchor="middle" fill="#c0c0d0" font-size="10">Humanities + TCM</text>

  <!-- Unit 2 -->
  <rect x="680" y="155" width="160" height="60" rx="6" fill="#0a2647" stroke="#e94560" stroke-width="1" opacity="0.8"/>
  <text x="760" y="173" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Unit 2</text>
  <text x="760" y="190" text-anchor="middle" fill="#c0c0d0" font-size="10">Resp + Cardiac</text>
  <text x="760" y="205" text-anchor="middle" fill="#c0c0d0" font-size="10">Urinary + MSK</text>

  <!-- Unit 3 -->
  <rect x="510" y="225" width="160" height="60" rx="6" fill="#0a2647" stroke="#e94560" stroke-width="1" opacity="0.8"/>
  <text x="590" y="243" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Unit 3</text>
  <text x="590" y="260" text-anchor="middle" fill="#c0c0d0" font-size="10">GI + Heme</text>
  <text x="590" y="275" text-anchor="middle" fill="#c0c0d0" font-size="10">Endo + Infect</text>

  <!-- Unit 4 -->
  <rect x="680" y="225" width="160" height="60" rx="6" fill="#0a2647" stroke="#e94560" stroke-width="1" opacity="0.8"/>
  <text x="760" y="243" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Unit 4</text>
  <text x="760" y="260" text-anchor="middle" fill="#c0c0d0" font-size="10">OB/GYN + Peds</text>
  <text x="760" y="275" text-anchor="middle" fill="#c0c0d0" font-size="10">Neuro + Psych</text>

  <!-- CBT Info -->
  <rect x="510" y="295" width="320" height="60" rx="6" fill="#0a2647" stroke="#8d99ae" stroke-width="1" opacity="0.5"/>
  <text x="670" y="315" text-anchor="middle" fill="#8d99ae" font-size="12" font-weight="bold">Computer-Based Testing (CBT)</text>
  <text x="670" y="332" text-anchor="middle" fill="#c0c0d0" font-size="11">150 Q per unit | 2 hours per unit | 5 question types</text>
  <text x="670" y="347" text-anchor="middle" fill="#c0c0d0" font-size="11">Cross-type navigation blocked</text>

  <!-- Content Distribution -->
  <text x="450" y="410" text-anchor="middle" fill="#4ecca3" font-size="16" font-weight="bold">Written Exam Content Distribution</text>

  <!-- Bar chart -->
  <rect x="80" y="440" width="500" height="220" rx="8" fill="#0a2647" opacity="0.5"/>

  <!-- Bars -->
  <rect x="110" y="450" width="375" height="30" rx="4" fill="#e94560" opacity="0.8"/>
  <text x="495" y="470" fill="#ffffff" font-size="12" font-weight="bold">75%</text>
  <text x="100" y="470" text-anchor="end" fill="#c0c0d0" font-size="11">Clinical Med</text>

  <rect x="110" y="490" width="75" height="30" rx="4" fill="#4ecca3" opacity="0.8"/>
  <text x="195" y="510" fill="#ffffff" font-size="12" font-weight="bold">15%</text>
  <text x="100" y="510" text-anchor="end" fill="#c0c0d0" font-size="11">Basic Med</text>

  <rect x="110" y="530" width="50" height="30" rx="4" fill="#f5a623" opacity="0.8"/>
  <text x="170" y="550" fill="#ffffff" font-size="12" font-weight="bold">10%</text>
  <text x="100" y="550" text-anchor="end" fill="#c0c0d0" font-size="11">Humanities</text>

  <text x="120" y="595" fill="#8d99ae" font-size="11">Clinical: Internal Med(32%) + Surgery(23%) + OBGYN(9.5%) + Peds(10.5%)</text>
  <text x="120" y="615" fill="#8d99ae" font-size="11">Basic: Physiology, Biochem, Pathology, Pharmacology, Microbiology, Immunology</text>
  <text x="120" y="635" fill="#8d99ae" font-size="11">Humanities: Ethics, Psychology, Health Regulations (2026 Revised)</text>

  <!-- Pass Rate Info -->
  <rect x="620" y="440" width="240" height="220" rx="8" fill="#0a2647" opacity="0.5" stroke="#e94560" stroke-width="1"/>
  <text x="740" y="465" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">Pass Rate Statistics</text>
  <text x="740" y="500" text-anchor="middle" fill="#4ecca3" font-size="13">Skills Exam</text>
  <text x="740" y="520" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">~70%</text>
  <text x="740" y="555" text-anchor="middle" fill="#f5a623" font-size="13">Written Exam</text>
  <text x="740" y="575" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">~18-22%</text>
  <text x="740" y="610" text-anchor="middle" fill="#e94560" font-size="13">Overall</text>
  <text x="740" y="635" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">~25%</text>

  <!-- Timeline -->
  <rect x="50" y="675" width="800" height="20" rx="4" fill="#0a2647" opacity="0.5"/>
  <text x="120" y="690" text-anchor="middle" fill="#8d99ae" font-size="10">Jan: Apply</text>
  <text x="280" y="690" text-anchor="middle" fill="#8d99ae" font-size="10">Feb-Mar: Verify</text>
  <text x="450" y="690" text-anchor="middle" fill="#4ecca3" font-size="10">Jun: Skills Exam</text>
  <text x="620" y="690" text-anchor="middle" fill="#e94560" font-size="10">Aug: Written (1st)</text>
  <text x="780" y="690" text-anchor="middle" fill="#f5a623" font-size="10">Nov: Written (2nd)</text>
</svg>
