<svg width="900" height="750"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phaseCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2647;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow5">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="750" fill="url(#bg5)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e94560" font-size="20" font-weight="bold">Study Workflow - 6-Month Comprehensive Plan</text>
  <text x="450" y="58" text-anchor="middle" fill="#8d99ae" font-size="12">From zero to exam-ready | 4 phases | Personalized to exam date</text>

  <!-- Phase 1 -->
  <rect x="50" y="80" width="800" height="130" rx="10" fill="url(#phaseCard)" stroke="#4ecca3" stroke-width="2" filter="url(#shadow5)"/>
  <rect x="50" y="80" width="800" height="30" rx="10" fill="#4ecca3" opacity="0.15"/>
  <circle cx="80" cy="95" r="14" fill="#4ecca3"/>
  <text x="80" y="100" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="bold">1</text>
  <text x="450" y="100" text-anchor="middle" fill="#4ecca3" font-size="15" font-weight="bold">Phase 1: Foundation Building (Months 1-2)</text>

  <text x="70" y="130" fill="#ffffff" font-size="12" font-weight="bold">Target: Establish knowledge framework</text>
  <text x="70" y="150" fill="#c0c0d0" font-size="11">Week 1-2: Physiology + Biochemistry (3h/day + 30 A1 questions)</text>
  <text x="70" y="168" fill="#c0c0d0" font-size="11">Week 3-4: Pathology + Pharmacology (mechanism focus + 30 A1/A2 questions)</text>
  <text x="70" y="186" fill="#c0c0d0" font-size="11">Week 5-6: Microbiology + Immunology + Preventive Medicine</text>
  <text x="70" y="204" fill="#c0c0d0" font-size="11">Week 7-8: Medical Humanities (2026 revised) + TCM Basics</text>

  <!-- Arrow -->
  <polygon points="445,215 455,225 445,235 435,225" fill="#8d99ae" opacity="0.5"/>

  <!-- Phase 2 -->
  <rect x="50" y="240" width="800" height="130" rx="10" fill="url(#phaseCard)" stroke="#e94560" stroke-width="2" filter="url(#shadow5)"/>
  <rect x="50" y="240" width="800" height="30" rx="10" fill="#e94560" opacity="0.15"/>
  <circle cx="80" cy="255" r="14" fill="#e94560"/>
  <text x="80" y="260" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">2</text>
  <text x="450" y="260" text-anchor="middle" fill="#e94560" font-size="15" font-weight="bold">Phase 2: Clinical Mastery (Months 3-4)</text>

  <text x="70" y="290" fill="#ffffff" font-size="12" font-weight="bold">Target: Master 75% clinical content (highest priority)</text>
  <text x="70" y="310" fill="#c0c0d0" font-size="11">Week 9-10: Internal Med - Cardiology + Pulmonology (A2/A3 practice)</text>
  <text x="70" y="328" fill="#c0c0d0" font-size="11">Week 11-12: Internal Med - GI + Renal + Endocrine (case analysis)</text>
  <text x="70" y="346" fill="#c0c0d0" font-size="11">Week 13-14: Internal Med - Heme + Neuro + Infectious Disease</text>
  <text x="70" y="364" fill="#c0c0d0" font-size="11">Week 15-16: Surgery + OBGYN + Pediatrics (high-frequency diseases)</text>

  <!-- Arrow -->
  <polygon points="445,375 455,385 445,395 435,385" fill="#8d99ae" opacity="0.5"/>

  <!-- Phase 3 -->
  <rect x="50" y="400" width="800" height="130" rx="10" fill="url(#phaseCard)" stroke="#f5a623" stroke-width="2" filter="url(#shadow5)"/>
  <rect x="50" y="400" width="800" height="30" rx="10" fill="#f5a623" opacity="0.15"/>
  <circle cx="80" cy="415" r="14" fill="#f5a623"/>
  <text x="80" y="420" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="bold">3</text>
  <text x="450" y="420" text-anchor="middle" fill="#f5a623" font-size="15" font-weight="bold">Phase 3: Skills Breakthrough (Month 5)</text>

  <text x="70" y="450" fill="#ffffff" font-size="12" font-weight="bold">Target: Pass practical skills exam (100 pts, 60 to pass)</text>
  <text x="70" y="470" fill="#c0c0d0" font-size="11">Week 1: Station 1 - History taking template + Case analysis framework</text>
  <text x="70" y="488" fill="#c0c0d0" font-size="11">Week 2: Station 2 - Physical exam (video + hands-on practice)</text>
  <text x="70" y="506" fill="#c0c0d0" font-size="11">Week 3: Station 2 - Basic operations (sterile technique + procedures)</text>
  <text x="70" y="524" fill="#c0c0d0" font-size="11">Week 4: Station 3 - ECG + Imaging + Auscultation + Full simulation</text>

  <!-- Arrow -->
  <polygon points="445,535 455,545 445,555 435,545" fill="#8d99ae" opacity="0.5"/>

  <!-- Phase 4 -->
  <rect x="50" y="560" width="800" height="130" rx="10" fill="url(#phaseCard)" stroke="#7b68ee" stroke-width="2" filter="url(#shadow5)"/>
  <rect x="50" y="560" width="800" height="30" rx="10" fill="#7b68ee" opacity="0.15"/>
  <circle cx="80" cy="575" r="14" fill="#7b68ee"/>
  <text x="80" y="580" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">4</text>
  <text x="450" y="580" text-anchor="middle" fill="#7b68ee" font-size="15" font-weight="bold">Phase 4: Written Exam Sprint (Month 6)</text>

  <text x="70" y="610" fill="#ffffff" font-size="12" font-weight="bold">Target: Pass written exam (600 Q, 360 to pass)</text>
  <text x="70" y="630" fill="#c0c0d0" font-size="11">Week 1: Past 5-year real exams (timed mock + error analysis)</text>
  <text x="70" y="648" fill="#c0c0d0" font-size="11">Week 2: High-frequency points review + error notebook</text>
  <text x="70" y="666" fill="#c0c0d0" font-size="11">Week 3: 3-5 full mock exams (simulate CBT environment)</text>
  <text x="70" y="684" fill="#c0c0d0" font-size="11">Week 4: Final review + mindset adjustment + rest before exam</text>

  <!-- Priority badge -->
  <rect x="700" y="700" width="150" height="30" rx="15" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
  <text x="775" y="720" text-anchor="middle" fill="#e94560" font-size="11" font-weight="bold">Clinical Med = 75% priority</text>
</svg>
