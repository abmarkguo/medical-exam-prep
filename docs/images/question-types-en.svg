<svg width="900" height="600"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="typeCard3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2647;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e94560" font-size="20" font-weight="bold">Five Question Types Distribution and Strategy</text>
  <text x="450" y="58" text-anchor="middle" fill="#8d99ae" font-size="12">All questions are single best answer (A-E) | Total: 600 questions | 1 point each</text>

  <!-- A1 Type -->
  <rect x="40" y="80" width="250" height="140" rx="10" fill="url(#typeCard3)" stroke="#4ecca3" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="40" y="80" width="250" height="30" rx="10" fill="#4ecca3" opacity="0.15"/>
  <text x="165" y="100" text-anchor="middle" fill="#4ecca3" font-size="14" font-weight="bold">A1: Single-Sentence Best Choice</text>
  <text x="60" y="130" fill="#ffffff" font-size="12" font-weight="bold">Share: ~25%</text>
  <text x="60" y="150" fill="#c0c0d0" font-size="11">Pure knowledge recall</text>
  <text x="60" y="167" fill="#c0c0d0" font-size="11">No clinical scenario</text>
  <text x="60" y="184" fill="#c0c0d0" font-size="11">Focus: Unit 1 (Basic + Humanities)</text>
  <text x="60" y="208" fill="#f5a623" font-size="11" font-weight="bold">Strategy: 30 sec/Q | Quick answer</text>

  <!-- A2 Type -->
  <rect x="325" y="80" width="250" height="140" rx="10" fill="url(#typeCard3)" stroke="#e94560" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="325" y="80" width="250" height="30" rx="10" fill="#e94560" opacity="0.15"/>
  <text x="450" y="100" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">A2: Case Summary Best Choice</text>
  <text x="345" y="130" fill="#ffffff" font-size="12" font-weight="bold">Share: ~25%</text>
  <text x="345" y="150" fill="#c0c0d0" font-size="11">Brief clinical case (1-3 sentences)</text>
  <text x="345" y="167" fill="#c0c0d0" font-size="11">Initial diagnosis or treatment</text>
  <text x="345" y="184" fill="#c0c0d0" font-size="11">Focus: All units</text>
  <text x="345" y="208" fill="#f5a623" font-size="11" font-weight="bold">Strategy: 60 sec/Q | Keyword extraction</text>

  <!-- A3 Type -->
  <rect x="610" y="80" width="250" height="140" rx="10" fill="url(#typeCard3)" stroke="#f5a623" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="610" y="80" width="250" height="30" rx="10" fill="#f5a623" opacity="0.15"/>
  <text x="735" y="100" text-anchor="middle" fill="#f5a623" font-size="14" font-weight="bold">A3: Case Group Best Choice</text>
  <text x="630" y="130" fill="#ffffff" font-size="12" font-weight="bold">Share: ~20%</text>
  <text x="630" y="150" fill="#c0c0d0" font-size="11">One case, 2-3 related questions</text>
  <text x="630" y="167" fill="#c0c0d0" font-size="11">Fixed information (no new data)</text>
  <text x="630" y="184" fill="#c0c0d0" font-size="11">Focus: Units 2-4</text>
  <text x="630" y="208" fill="#f5a623" font-size="11" font-weight="bold">Strategy: 90 sec/group | Dx first</text>

  <!-- A4 Type -->
  <rect x="183" y="250" width="250" height="140" rx="10" fill="url(#typeCard3)" stroke="#7b68ee" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="183" y="250" width="250" height="30" rx="10" fill="#7b68ee" opacity="0.15"/>
  <text x="308" y="270" text-anchor="middle" fill="#7b68ee" font-size="14" font-weight="bold">A4: Case Series Best Choice</text>
  <text x="203" y="300" fill="#ffffff" font-size="12" font-weight="bold">Share: ~15%</text>
  <text x="203" y="320" fill="#c0c0d0" font-size="11">Progressive case, 3-6 questions</text>
  <text x="203" y="337" fill="#c0c0d0" font-size="11">New info added step by step</text>
  <text x="203" y="354" fill="#c0c0d0" font-size="11">Focus: Units 3-4 (most complex)</text>
  <text x="203" y="378" fill="#f5a623" font-size="11" font-weight="bold">Strategy: 120 sec/group | Dynamic Dx</text>

  <!-- B1 Type -->
  <rect x="467" y="250" width="250" height="140" rx="10" fill="url(#typeCard3)" stroke="#4ecca3" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="467" y="250" width="250" height="30" rx="10" fill="#4ecca3" opacity="0.15"/>
  <text x="592" y="270" text-anchor="middle" fill="#4ecca3" font-size="14" font-weight="bold">B1: Standard Matching</text>
  <text x="487" y="300" fill="#ffffff" font-size="12" font-weight="bold">Share: ~15%</text>
  <text x="487" y="320" fill="#c0c0d0" font-size="11">5 shared options, 2-5 questions</text>
  <text x="487" y="337" fill="#c0c0d0" font-size="11">Options can repeat or not be used</text>
  <text x="487" y="354" fill="#c0c0d0" font-size="11">Focus: Differential diagnosis</text>
  <text x="487" y="378" fill="#f5a623" font-size="11" font-weight="bold">Strategy: 45 sec/Q | Read options first</text>

  <!-- Time Management Section -->
  <rect x="40" y="420" width="820" height="160" rx="10" fill="#0a2647" stroke="#0f3460" stroke-width="1" filter="url(#shadow3)"/>
  <text x="450" y="445" text-anchor="middle" fill="#e94560" font-size="16" font-weight="bold">Time Management per Unit (150 Questions / 2 Hours)</text>

  <!-- Timeline bar -->
  <rect x="70" y="470" width="760" height="30" rx="4" fill="#16213e"/>

  <rect x="70" y="470" width="150" height="30" rx="4" fill="#4ecca3" opacity="0.7"/>
  <text x="145" y="490" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">A1: 25-30 min</text>

  <rect x="220" y="470" width="200" height="30" rx="4" fill="#e94560" opacity="0.7"/>
  <text x="320" y="490" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">A2: 35-40 min</text>

  <rect x="420" y="470" width="200" height="30" rx="4" fill="#f5a623" opacity="0.7"/>
  <text x="520" y="490" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">A3/A4: 35-40 min</text>

  <rect x="620" y="470" width="130" height="30" rx="4" fill="#7b68ee" opacity="0.7"/>
  <text x="685" y="490" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">B1: 15-20 min</text>

  <rect x="750" y="470" width="80" height="30" rx="4" fill="#8d99ae" opacity="0.5"/>
  <text x="790" y="490" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Check: 5-10m</text>

  <!-- Key Tips -->
  <text x="70" y="525" fill="#f5a623" font-size="12" font-weight="bold">CBT Alert:</text>
  <text x="155" y="525" fill="#c0c0d0" font-size="12">Cross-type navigation is BLOCKED. Once you move to the next question type, you cannot return.</text>

  <text x="70" y="548" fill="#4ecca3" font-size="12" font-weight="bold">Key Strategy:</text>
  <text x="165" y="548" fill="#c0c0d0" font-size="12">Answer A1 quickly | Invest time in A2/A3/A4 | Read B1 options first | Save 5-10 min for review</text>

  <text x="70" y="571" fill="#e94560" font-size="12" font-weight="bold">Difficulty:</text>
  <text x="140" y="571" fill="#c0c0d0" font-size="12">A4 (most complex) &gt; A3 &gt; A2 &gt; B1 &gt; A1 (easiest)</text>
</svg>
