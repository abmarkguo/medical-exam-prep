<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="loopCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2647;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#bg7)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e94560" font-size="20" font-weight="bold">Practice Loop - Modules 2, 3 and 4</text>
  <text x="450" y="58" text-anchor="middle" fill="#8d99ae" font-size="12">Generate questions -&gt; Practice -&gt; Analyze -&gt; Review -&gt; Track progress</text>

  <!-- Central Loop Diagram -->
  <!-- Step 1: Generate -->
  <circle cx="450" cy="180" r="65" fill="url(#loopCard)" stroke="#4ecca3" stroke-width="3" filter="url(#shadow7)"/>
  <text x="450" y="170" text-anchor="middle" fill="#4ecca3" font-size="14" font-weight="bold">Step 1</text>
  <text x="450" y="188" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Generate</text>
  <text x="450" y="205" text-anchor="middle" fill="#c0c0d0" font-size="11">Questions + Cases</text>

  <!-- Arrow to Step 2 -->
  <path d="M 510 200 Q 580 250 580 310" stroke="#e94560" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="575,305 585,308 582,318" fill="#e94560"/>

  <!-- Step 2: Practice -->
  <circle cx="580" cy="370" r="65" fill="url(#loopCard)" stroke="#e94560" stroke-width="3" filter="url(#shadow7)"/>
  <text x="580" y="360" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">Step 2</text>
  <text x="580" y="378" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Practice</text>
  <text x="580" y="395" text-anchor="middle" fill="#c0c0d0" font-size="11">Answer + Time</text>

  <!-- Arrow to Step 3 -->
  <path d="M 580 440 Q 580 500 510 500" stroke="#f5a623" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="515,495 515,505 505,500" fill="#f5a623"/>

  <!-- Step 3: Analyze -->
  <circle cx="450" cy="530" r="65" fill="url(#loopCard)" stroke="#f5a623" stroke-width="3" filter="url(#shadow7)"/>
  <text x="450" y="520" text-anchor="middle" fill="#f5a623" font-size="14" font-weight="bold">Step 3</text>
  <text x="450" y="538" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Analyze</text>
  <text x="450" y="555" text-anchor="middle" fill="#c0c0d0" font-size="11">Errors + Gaps</text>

  <!-- Arrow to Step 4 -->
  <path d="M 390 510 Q 320 500 320 440" stroke="#7b68ee" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="315,445 325,442 322,432" fill="#7b68ee"/>

  <!-- Step 4: Review -->
  <circle cx="320" cy="370" r="65" fill="url(#loopCard)" stroke="#7b68ee" stroke-width="3" filter="url(#shadow7)"/>
  <text x="320" y="360" text-anchor="middle" fill="#7b68ee" font-size="14" font-weight="bold">Step 4</text>
  <text x="320" y="378" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Review</text>
  <text x="320" y="395" text-anchor="middle" fill="#c0c0d0" font-size="11">Reinforce</text>

  <!-- Arrow back to Step 1 -->
  <path d="M 320 310 Q 320 250 390 200" stroke="#4ecca3" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="385,205 395,202 392,192" fill="#4ecca3"/>

  <!-- Center label -->
  <text x="450" y="360" text-anchor="middle" fill="#8d99ae" font-size="16" font-weight="bold">Practice</text>
  <text x="450" y="380" text-anchor="middle" fill="#8d99ae" font-size="16" font-weight="bold">Loop</text>

  <!-- Module 2 details (left) -->
  <rect x="20" y="80" width="170" height="80" rx="8" fill="#0a2647" stroke="#e94560" stroke-width="1" opacity="0.7"/>
  <text x="105" y="100" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Module 2</text>
  <text x="105" y="118" text-anchor="middle" fill="#ffffff" font-size="11">Question Practice</text>
  <text x="105" y="135" fill="#c0c0d0" font-size="10">A1/A2/A3/A4/B1</text>
  <text x="105" y="150" fill="#c0c0d0" font-size="10">By system or type</text>

  <!-- Module 3 details (right) -->
  <rect x="710" y="80" width="170" height="80" rx="8" fill="#0a2647" stroke="#f5a623" stroke-width="1" opacity="0.7"/>
  <text x="795" y="100" text-anchor="middle" fill="#f5a623" font-size="12" font-weight="bold">Module 3</text>
  <text x="795" y="118" text-anchor="middle" fill="#ffffff" font-size="11">Case Analysis</text>
  <text x="795" y="135" fill="#c0c0d0" font-size="10">Progressive scenarios</text>
  <text x="795" y="150" fill="#c0c0d0" font-size="10">A3/A4 simulation</text>

  <!-- Module 4 details (bottom) -->
  <rect x="710" y="560" width="170" height="80" rx="8" fill="#0a2647" stroke="#7b68ee" stroke-width="1" opacity="0.7"/>
  <text x="795" y="580" text-anchor="middle" fill="#7b68ee" font-size="12" font-weight="bold">Module 4</text>
  <text x="795" y="598" text-anchor="middle" fill="#ffffff" font-size="11">Skills Simulation</text>
  <text x="795" y="615" fill="#c0c0d0" font-size="10">3-station exam sim</text>
  <text x="795" y="630" fill="#c0c0d0" font-size="10">Scoring rubric</text>

  <!-- Error analysis details (bottom-left) -->
  <rect x="20" y="560" width="170" height="80" rx="8" fill="#0a2647" stroke="#f5a623" stroke-width="1" opacity="0.7"/>
  <text x="105" y="580" text-anchor="middle" fill="#f5a623" font-size="12" font-weight="bold">Error Analysis</text>
  <text x="105" y="598" fill="#c0c0d0" font-size="10">By subject accuracy</text>
  <text x="105" y="615" fill="#c0c0d0" font-size="10">By question type</text>
  <text x="105" y="630" fill="#c0c0d0" font-size="10">Error cause tracking</text>

  <!-- Feedback arrows -->
  <line x1="190" y1="120" x2="390" y2="160" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="710" y1="120" x2="510" y2="160" stroke="#f5a623" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="710" y1="600" x2="510" y2="550" stroke="#7b68ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="190" y1="600" x2="390" y2="550" stroke="#f5a623" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
</svg>
